name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: |
          python -m pip install beautifulsoup4
      - name: Verify Blog Chronological Order Hard Gate
        run: |
          python3 scripts/verify_blog_chronological_order.py
      - name: Exclude internal docs and operational directories from Pages artifact
        run: |
          rm -rf research scripts templates distribution_packages PROJECT_EXECUTION_MANUAL.md GEO_SEO_AI_CONTENT_STANDARD.md DESIGN.md
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
