<!-- English Toast -->
<div id="mq-en-share-toast" style="display:none; position:fixed; bottom:32px; left:50%; transform:translateX(-50%); background:rgba(15,23,42,0.92); color:#ffffff; padding:12px 24px; border-radius:30px; font-size:13.5px; font-weight:600; box-shadow:0 10px 25px rgba(0,0,0,0.25); backdrop-filter:blur(8px); z-index:999999; align-items:center; gap:8px;">
  <span id="mq-en-toast-icon">✓</span>
  <span id="mq-en-toast-text">Link copied to clipboard</span>
</div>

<script>
function mqShowEnToast(text, icon) {
  var toast = document.getElementById('mq-en-share-toast');
  var txt = document.getElementById('mq-en-toast-text');
  var ico = document.getElementById('mq-en-toast-icon');
  if(!toast) return;
  txt.innerText = text;
  ico.innerText = icon || '✓';
  toast.style.display = 'inline-flex';
  clearTimeout(window._mqEnToastTimer);
  window._mqEnToastTimer = setTimeout(function() {
    toast.style.display = 'none';
  }, 3200);
}

function mqCopyEnArticleLink(url) {
  var targetUrl = url || window.location.href;
  mqFallbackEnCopy(targetUrl, 'Link copied to clipboard! Ready to share.');
}

function mqFallbackEnCopy(text, msg) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function() {
      mqShowEnToast(msg || 'Copied to clipboard!', '✓');
    }).catch(function() {
      mqExecEnCopy(text, msg);
    });
  } else {
    mqExecEnCopy(text, msg);
  }
}

function mqExecEnCopy(text, msg) {
  var textArea = document.createElement("textarea");
  textArea.value = text;
  textArea.style.position = "fixed";
  textArea.style.left = "-999999px";
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  try {
    document.execCommand('copy');
    mqShowEnToast(msg || 'Copied to clipboard!', '✓');
  } catch (err) {
    prompt('Copy link manually:', text);
  }
  document.body.removeChild(textArea);
}

function mqOpenEnWechatModal() {
  var modal = document.getElementById('mq-en-wechat-modal');
  if(modal) modal.style.display = 'flex';
}

function mqCloseEnWechatModal() {
  var modal = document.getElementById('mq-en-wechat-modal');
  if(modal) modal.style.display = 'none';
}

function mqShareToEnXhs(title, url) {
  var shareText = title + ' ' + (url || window.location.href) + ' (Via MUQI Tech Official Blog)';
  mqFallbackEnCopy(shareText, '✨ Title & link copied! Ready to paste into RED Note.');
}
</script>
