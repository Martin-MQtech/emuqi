<!-- 浮动操作提示消息 (Toast) -->
<div id="mq-share-toast" style="display:none; position:fixed; bottom:32px; left:50%; transform:translateX(-50%); background:rgba(15,23,42,0.92); color:#ffffff; padding:12px 24px; border-radius:30px; font-size:13.5px; font-weight:600; box-shadow:0 10px 25px rgba(0,0,0,0.25); backdrop-filter:blur(8px); z-index:999999; align-items:center; gap:8px;">
  <span id="mq-toast-icon">✓</span>
  <span id="mq-toast-text">已复制到剪贴板</span>
</div>

<script>
function mqShowToast(text, icon) {
  var toast = document.getElementById('mq-share-toast');
  var txt = document.getElementById('mq-toast-text');
  var ico = document.getElementById('mq-toast-icon');
  if(!toast) return;
  txt.innerText = text;
  ico.innerText = icon || '✓';
  toast.style.display = 'inline-flex';
  clearTimeout(window._mqToastTimer);
  window._mqToastTimer = setTimeout(function() {
    toast.style.display = 'none';
  }, 3200);
}

function mqCopyArticleLink(title, url) {
  var targetUrl = url || window.location.href;
  mqFallbackCopy(targetUrl, '文章链接已成功复制，可前往任意社交平台粘贴分享！');
}

function mqFallbackCopy(text, msg) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function() {
      mqShowToast(msg || '已成功复制到剪贴板！', '✓');
    }).catch(function() {
      mqExecCopy(text, msg);
    });
  } else {
    mqExecCopy(text, msg);
  }
}

function mqExecCopy(text, msg) {
  var textArea = document.createElement("textarea");
  textArea.value = text;
  textArea.style.position = "fixed";
  textArea.style.left = "-999999px";
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  try {
    document.execCommand('copy');
    mqShowToast(msg || '已成功复制到剪贴板！', '✓');
  } catch (err) {
    prompt('请长按复制链接：', text);
  }
  document.body.removeChild(textArea);
}

function mqOpenWechatShareModal() {
  var modal = document.getElementById('mq-wechat-modal');
  if(modal) modal.style.display = 'flex';
}

function mqCloseWechatShareModal() {
  var modal = document.getElementById('mq-wechat-modal');
  if(modal) modal.style.display = 'none';
}

function mqShareToXhs(title, url) {
  var shareText = '【' + title + '】' + (url || window.location.href) + ' （来自木齐科技官方博客）';
  mqFallbackCopy(shareText, '✨ 已复制文章标题与链接！打开小红书 App 即可在发笔记或私聊时快速粘贴');
}

function mqShareToBilibili(title, url) {
  var shareText = '【' + title + '】' + (url || window.location.href);
  mqFallbackCopy(shareText, '📺 已复制文案！正在为您前往 Bilibili 动态发布页面...');
  setTimeout(function() {
    window.open('https://t.bilibili.com/', '_blank');
  }, 1000);
}
</script>
