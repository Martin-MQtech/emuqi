<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="50%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <radialGradient id="micGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#studioBg)"/>

  <!-- Tech Soundwave Grid -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Right Visual: Gary Brecka Authentic Studio Portrait & Molecular H2 -->
  <g transform="translate(720, 60)" filter="url(#cardShadow)">
    <clipPath id="portraitClip">
      <rect width="420" height="540" rx="20"/>
    </clipPath>
    <!-- Border Glow -->
    <rect x="-4" y="-4" width="428" height="548" rx="24" fill="none" stroke="#00f2fe" stroke-width="3" opacity="0.8"/>
    <!-- Gary Brecka Real Portrait -->
    <image href="gary-brecka.jpg" width="420" height="540" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)"/>
    <!-- Overlay Gradient on Image for seamless blending -->
    <rect width="420" height="540" rx="20" fill="url(#studioBg)" opacity="0.3"/>
    
    <!-- Floating H2 Badge over Photo -->
    <g transform="translate(30, 420)">
      <rect width="360" height="90" rx="14" fill="#070d18" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="50" cy="45" r="28" fill="url(#neonCyan)"/>
      <text x="50" y="54" fill="#070d18" font-size="22" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">H₂</text>
      <text x="90" y="38" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">MOLECULAR HYDROGEN</text>
      <text x="90" y="60" fill="#38bdf8" font-size="12" font-family="system-ui, sans-serif">ORP -800mV · 1600+ ppb · Biohack</text>
    </g>
  </g>

  <!-- Left Content Info Area -->
  <!-- Top Pill -->
  <rect x="80" y="80" width="260" height="38" rx="8" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="102" cy="99" r="5" fill="#22c55e"/>
  <text x="118" y="105" fill="#e0f2fe" font-size="13.5" font-weight="bold" font-family="system-ui, sans-serif" letter-spacing="1">GARY BRECKA PODCAST WAVE</text>

  <!-- Main Headline -->
  <text x="80" y="185" fill="#ffffff" font-size="44" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="-0.5">致敬 Gary Brecka 氢水科普热潮：</text>
  <text x="80" y="245" fill="url(#neonCyan)" font-size="42" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="-0.5">从网红流量走向免插电固态氢新生态</text>

  <text x="80" y="305" fill="#cbd5e1" font-size="18" font-family="system-ui, sans-serif" font-weight="400">Beyond the Biohacking Hype: Clinical Science &amp; Portable Solid-State H₂ Revolution</text>

  <!-- 3 Key Value Cards -->
  <g transform="translate(80, 360)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="190" height="85" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b"/>
    <text x="20" y="32" fill="#38bdf8" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">🎙️ 顶流科普背书</text>
    <text x="20" y="58" fill="#94a3b8" font-size="12.5" font-family="system-ui, sans-serif">Joe Rogan / Dana White</text>

    <!-- Card 2 -->
    <rect x="210" y="0" width="190" height="85" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b"/>
    <text x="230" y="32" fill="#38bdf8" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">⚡ 免插电无界延伸</text>
    <text x="230" y="58" fill="#94a3b8" font-size="12.5" font-family="system-ui, sans-serif">随行杯 · 弱碱茶包 · 敷贴</text>

    <!-- Card 3 -->
    <rect x="420" y="0" width="190" height="85" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b"/>
    <text x="440" y="32" fill="#38bdf8" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">🔬 医工交叉实证</text>
    <text x="440" y="58" fill="#94a3b8" font-size="12.5" font-family="system-ui, sans-serif">零臭氧 · 零重金属析出</text>
  </g>

  <!-- Bottom Brand Signature -->
  <text x="80" y="510" fill="#64748b" font-size="14" font-family="system-ui, sans-serif">MUQI TECHNOLOGY · 全球功能矿物陶瓷材料与固态氢供应链先行者</text>
</svg>