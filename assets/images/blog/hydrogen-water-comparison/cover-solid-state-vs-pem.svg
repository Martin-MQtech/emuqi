<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1e3a"/>
      <stop offset="55%" stop-color="#12294d"/>
      <stop offset="100%" stop-color="#1a3a6e"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f47b20"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowOrange" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- 网格装饰 -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200"/>
    <path d="M100 0 V675 M200 0 V675 M300 0 V675 M400 0 V675 M500 0 V675 M600 0 V675 M700 0 V675 M800 0 V675 M900 0 V675 M1000 0 V675 M1100 0 V675"/>
  </g>

  <!-- 品牌角标 -->
  <g transform="translate(60,52)">
    <circle cx="22" cy="22" r="22" fill="url(#orangeGrad)"/>
    <path d="M22 10 a12 12 0 1 0 0 24 a10 10 0 0 0 0 -24 z" fill="#0d1e3a"/>
    <text x="52" y="30" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="1">MUQI TECH</text>
  </g>

  <!-- 中央 VS 徽章 -->
  <g transform="translate(600,330)">
    <circle r="62" fill="#0d1e3a" stroke="url(#orangeGrad)" stroke-width="5" filter="url(#shadow)"/>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#fbbf24" letter-spacing="1">VS</text>
  </g>

  <!-- 左侧：固态氢 (ICR) -->
  <g transform="translate(60,170)">
    <circle cx="150" cy="140" r="86" fill="#f47b20" opacity="0.16" filter="url(#glowOrange)"/>
    <circle cx="150" cy="140" r="64" fill="url(#orangeGrad)" filter="url(#shadow)"/>
    <text x="150" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#0d1e3a">H₂</text>
    <text x="0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff">SOLID-STATE</text>
    <text x="0" y="98" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#93c5fd">ICR Media · Mineral-Releasing</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#dbeafe">
      <text x="0" y="258">● 0 W — reacts with water</text>
      <text x="0" y="294">● 1,000–1,500 ppb sustained</text>
      <text x="0" y="330">● 18–24 h half-life</text>
      <text x="0" y="366">● Minerals: Mg · Ca · Si · Sr</text>
    </g>
  </g>

  <!-- 右侧：SPE/PEM -->
  <g transform="translate(640,170)">
    <circle cx="500" cy="140" r="86" fill="#38bdf8" opacity="0.14" filter="url(#glowOrange)"/>
    <circle cx="500" cy="140" r="64" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="500" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#ffffff">⚡</text>
    <text x="500" y="60" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff">SPE / PEM</text>
    <text x="500" y="98" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#7dd3fc">Electrolysis · Electric Devices</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#e0f2fe" text-anchor="end">
      <text x="500" y="258">● Power supply required ●</text>
      <text x="500" y="294">● 1,000–3,000 ppb while on ●</text>
      <text x="500" y="330">● ~2–4 h half-life ●</text>
      <text x="500" y="366">● Hydrogen only, vented ●</text>
    </g>
  </g>

  <!-- 底部信息条 -->
  <g transform="translate(0,590)">
    <rect width="1200" height="85" fill="#0a1628" opacity="0.72"/>
    <text x="60" y="47" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Hydrogen Water Technology Comparison</text>
    <text x="60" y="74" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">A buyer's field guide for brand &amp; product teams · Complementary, not competing</text>
    <text x="1140" y="52" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#f47b20">emuqi.com</text>
  </g>
</svg>