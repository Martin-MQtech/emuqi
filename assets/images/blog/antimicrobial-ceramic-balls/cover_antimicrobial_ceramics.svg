<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1e3a"/>
      <stop offset="50%" stop-color="#16325c"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d082"/>
      <stop offset="100%" stop-color="#c89a3c"/>
    </linearGradient>
    <radialGradient id="sphereGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f2b5c" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- 网格装饰背景 -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200"/>
    <path d="M100 0 V675 M200 0 V675 M300 0 V675 M400 0 V675 M500 0 V675 M600 0 V675 M700 0 V675 M800 0 V675 M900 0 V675 M1000 0 V675 M1100 0 V675"/>
  </g>

  <!-- 科技光晕与微观粒子 -->
  <circle cx="920" cy="340" r="220" fill="#38bdf8" opacity="0.15" filter="blur(40px)"/>
  <circle cx="920" cy="340" r="160" fill="url(#sphereGlow)" filter="url(#shadow)"/>
  
  <!-- 离子轨道环 -->
  <ellipse cx="920" cy="340" rx="220" ry="70" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 8" opacity="0.7" transform="rotate(-25 920 340)"/>
  <ellipse cx="920" cy="340" rx="200" ry="85" fill="none" stroke="#c89a3c" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" transform="rotate(35 920 340)"/>

  <!-- 微观离子小球 -->
  <circle cx="800" cy="240" r="18" fill="url(#sphereGlow)"/>
  <circle cx="1060" cy="290" r="14" fill="url(#goldGrad)"/>
  <circle cx="840" cy="440" r="22" fill="url(#sphereGlow)"/>
  <circle cx="1020" cy="420" r="12" fill="#60a5fa"/>

  <!-- 左侧文案区 -->
  <rect x="80" y="80" width="170" height="36" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1"/>
  <text x="165" y="104" fill="#38bdf8" font-size="16" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="2">MUQI TECH · 产业深研</text>

  <text x="80" y="190" fill="#ffffff" font-size="46" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1">一颗陶瓷球，</text>
  <text x="80" y="255" fill="url(#goldGrad)" font-size="46" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1">如何撬动百亿健康家电链？</text>

  <text x="80" y="320" fill="#cbd5e1" font-size="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500">抗菌陶瓷材料全场景应用与 ICR 智控释溶技术深度解析</text>

  <!-- 4 大核心标签卡 -->
  <g transform="translate(80, 375)">
    <rect x="0" y="0" width="130" height="70" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#334155"/>
    <text x="65" y="30" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">水处理领域</text>
    <text x="65" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">净水 / 杯壶 / 储水</text>

    <rect x="145" y="0" width="130" height="70" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#334155"/>
    <text x="210" y="30" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">健康家电</text>
    <text x="210" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">加湿器/扫地机/空调</text>

    <rect x="290" y="0" width="130" height="70" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#334155"/>
    <text x="355" y="30" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">卫浴洁具</text>
    <text x="355" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">花洒 / 水龙头 / 马桶</text>

    <rect x="435" y="0" width="130" height="70" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#334155"/>
    <text x="500" y="30" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">宠物家居</text>
    <text x="500" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">饮水机 / 猫砂 / 日化</text>
  </g>

  <!-- 底部背书条 -->
  <g transform="translate(80, 490)">
    <rect x="0" y="0" width="565" height="105" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#c89a3c" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#c89a3c" opacity="0.2"/>
    <text x="35" y="41" fill="#c89a3c" font-size="16" font-weight="bold" text-anchor="middle">★</text>
    <text x="65" y="36" fill="#ffffff" font-size="16" font-weight="bold">全国抗菌表面性能标准化技术委员会 (SAC/TC621)</text>
    <text x="65" y="65" fill="#fef08a" font-size="14" font-weight="bold">山东木齐健康科技 · 第一届委员单位出任委员（陶瓷球行业唯一入选企业）</text>
    <text x="65" y="88" fill="#94a3b8" font-size="12">实验室实测抗菌率 99.9% · 0.2s 极速除氯 · 固态富氢赋能</text>
  </g>
</svg>