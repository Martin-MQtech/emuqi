<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550">
  <rect width="1000" height="550" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  
  <rect x="30" y="25" width="940" height="55" rx="8" fill="#1a3a6e"/>
  <text x="500" y="60" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">木齐科技 ICR 智控释溶技术 vs 传统抗菌材料机理对比</text>

  <!-- 左侧：传统技术痛点 -->
  <g transform="translate(50, 105)">
    <rect width="420" height="400" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <rect width="420" height="40" rx="10" fill="#ffe4e6"/>
    <text x="210" y="26" fill="#e11d48" font-size="16" font-weight="bold" text-anchor="middle">传统表面附着 / 粗放添加型</text>

    <!-- 示意图 -->
    <rect x="30" y="60" width="360" height="120" rx="8" fill="#ffffff" stroke="#fecdd3"/>
    <circle cx="90" cy="120" r="35" fill="#fda4af" opacity="0.5"/>
    <circle cx="90" cy="120" r="20" fill="#e11d48" opacity="0.8"/>
    <text x="90" y="125" fill="#ffffff" font-size="11" text-anchor="middle">易脱落</text>
    
    <!-- 曲线图：初期爆发，迅速失效 -->
    <path d="M170 150 Q 210 75, 250 85 T 370 160" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="4 2"/>
    <text x="260" y="80" fill="#e11d48" font-size="11" font-weight="bold">前期爆发式超标释放</text>
    <text x="340" y="150" fill="#9f1239" font-size="11">后期失效断崖</text>

    <text x="30" y="210" fill="#9f1239" font-size="14" font-weight="bold">❌ 致命缺陷：</text>
    <text x="30" y="238" fill="#4c0519" font-size="13">1. 物理涂层结合力差，水流冲刷极易脱落</text>
    <text x="30" y="268" fill="#4c0519" font-size="13">2. 初始阶段银离子严重析出超标（重金属隐患）</text>
    <text x="30" y="298" fill="#4c0519" font-size="13">3. 30天后抗菌活性断崖式归零，寿命极短</text>
    <text x="30" y="328" fill="#4c0519" font-size="13">4. 无法耐受高温高湿与复杂酸碱水质环境</text>
    <text x="30" y="365" fill="#be123c" font-size="12" font-style="italic">导致家电厂家频发售后质量投诉与虚标风险</text>
  </g>

  <!-- 右侧：木齐 ICR 智控释溶技术 -->
  <g transform="translate(530, 105)">
    <rect width="420" height="400" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="420" height="40" rx="10" fill="#dcfce7"/>
    <text x="210" y="26" fill="#15803d" font-size="16" font-weight="bold" text-anchor="middle">木齐 ICR 智控释溶技术（晶格嵌入）</text>

    <!-- 示意图 -->
    <rect x="30" y="60" width="360" height="120" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
    <circle cx="90" cy="120" r="35" fill="#86efac" opacity="0.5"/>
    <circle cx="90" cy="120" r="28" fill="#16a34a" opacity="0.8"/>
    <text x="90" y="125" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">晶格固溶</text>
    
    <!-- 曲线图：恒定持久缓释 -->
    <path d="M170 115 L 370 115" fill="none" stroke="#16a34a" stroke-width="3.5"/>
    <text x="270" y="105" fill="#15803d" font-size="11" font-weight="bold">恒定 0 阶匀速缓释</text>
    <text x="270" y="145" fill="#166534" font-size="11">长效寿命超 12-24 个月</text>

    <text x="30" y="210" fill="#166534" font-size="14" font-weight="bold">✅ 核心技术壁垒：</text>
    <text x="30" y="238" fill="#14532d" font-size="13">1. 1000℃+ 高温烧结，纳米银精准嵌入陶瓷骨架晶格</text>
    <text x="30" y="268" fill="#14532d" font-size="13">2. 离子交换微孔缓释通道，水溶浓度稳定在安全阈值</text>
    <text x="30" y="298" fill="#14532d" font-size="13">3. 实验室抗菌率实测 &gt;99.9%，耐高温、耐磨损、抗酸碱</text>
    <text x="30" y="328" fill="#14532d" font-size="13">4. 全球权威认证，符合涉水卫生与欧盟 RoHS/REACH 标准</text>
    <text x="30" y="365" fill="#15803d" font-size="12" font-weight="bold">为头部扫地机、净水机提供免维护、零投诉底层材料保障</text>
  </g>
</svg>